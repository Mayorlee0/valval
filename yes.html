<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#ffb3c7" />
  <title>Approved 💘</title>
  <link rel="stylesheet" href="./styles.css" />
</head>

<body data-page="yes">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="topbar">
    <a class="brand-link" href="./index.html" aria-label="Back to start">💘</a>

    <button
      id="muteBtn"
      class="icon-btn"
      type="button"
      aria-label="Toggle sound"
      aria-pressed="false"
      title="Sound"
    >
      <span class="icon" aria-hidden="true">🔊</span>
    </button>
  </header>

  <main id="main" class="wrap">
    <section class="card card-success" aria-labelledby="headline">
      <canvas id="confetti" class="confetti" aria-hidden="true"></canvas>

      <div class="success-badge" aria-hidden="true">💘</div>
      <h1 id="headline" class="title">Approved 💘</h1>

      <p class="subtext">
        Barbara, you just made my whole month.
      </p>

      <figure class="photo-frame">
        <img
          class="photo-image"
          src="https://drive.google.com/uc?export=view&id=12pD8X472wVkaZjLClFN6q7lnl5w60fma"
          alt="Barbara and me, a favorite photo"
          loading="lazy"
        />
        <figcaption class="photo-caption">Our favorite moment ✨</figcaption>
      </figure>

      <div class="btn-row">
        <a class="btn btn-primary" href="./date.html" id="planBtn">
          Let’s plan our date 🎁
        </a>
      </div>

      <div class="tiny-note">
        Warning: excessive smiling may occur.
      </div>
    </section>

    <footer class="footer">
      <span>Next step: choose the vibe ✨</span>
    </footer>
  </main>

  <script src="./script.js"></script>
</body>
</html>
